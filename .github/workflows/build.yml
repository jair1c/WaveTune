- name: Generar Gradle Wrapper
  run: gradle wrapper --gradle-version 8.9
name: Build WaveTune

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # permite lanzarlo manualmente desde la UI de GitHub

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Subir APK Debug como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: WaveTune-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
